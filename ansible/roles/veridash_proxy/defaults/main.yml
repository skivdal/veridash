---
veridash_domain: unconfigured.example
veridash_manage_tls: true
veridash_acme_email: unconfigured@example.invalid
veridash_acme_webroot: /var/www/acme
veridash_tls_certificate: "/etc/letsencrypt/live/{{ veridash_domain }}/fullchain.pem"
veridash_tls_certificate_key: "/etc/letsencrypt/live/{{ veridash_domain }}/privkey.pem"
veridash_legacy_enabled: false
veridash_legacy_domain: old.unconfigured.example
veridash_legacy_upstream: http://127.0.0.1:3000
veridash_legacy_tls_certificate: "/etc/letsencrypt/live/{{ veridash_legacy_domain }}/fullchain.pem"
veridash_legacy_tls_certificate_key: "/etc/letsencrypt/live/{{ veridash_legacy_domain }}/privkey.pem"
veridash_obsolete_proxy_sites: []
