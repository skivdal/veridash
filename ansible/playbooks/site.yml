---
- name: Provision and deploy VeriDash
  hosts: all
  become: true
  roles:
    - veridash_host
    - veridash_database
    # Install units before GPU containers start: a later systemd daemon-reload can
    # invalidate NVIDIA device access for an already-running container.
    - veridash_backup
    - veridash_application
    - veridash_proxy
