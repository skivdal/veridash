---
all:
  hosts:
    veridash-vps:
      ansible_host: 203.0.113.10
      ansible_user: root
  vars:
    veridash_domain: veridash.example.org
    veridash_database_port: 5432
    # Set false when Docker CE is already installed from Docker's repository.
    veridash_install_docker_package: true
    # Optional legacy application retained on a loopback-only upstream.
    veridash_legacy_enabled: false
    veridash_legacy_domain: old.veridash.example.org
    veridash_legacy_upstream: http://127.0.0.1:3000
    veridash_release_id: replace-with-release-id
    veridash_api_image: ghcr.io/skivdal/veridash-api@sha256:replace
    veridash_scheduler_image: ghcr.io/skivdal/veridash-scheduler@sha256:replace
    veridash_worker_image: ghcr.io/skivdal/veridash-worker@sha256:replace
    # Required when veridash_enable_gpu_worker is true.
    veridash_worker_gpu_image: ghcr.io/skivdal/veridash-worker-gpu@sha256:replace
    # Required when veridash_enable_translation_worker is true.
    veridash_worker_translation_image: ghcr.io/skivdal/veridash-worker-translation@sha256:replace
    veridash_migration_image: ghcr.io/skivdal/veridash-migration@sha256:replace
    veridash_tls_certificate: /etc/letsencrypt/live/veridash.example.org/fullchain.pem
    veridash_tls_certificate_key: /etc/letsencrypt/live/veridash.example.org/privkey.pem
    # Put vault_veridash_database_password and, when translation is enabled,
    # vault_veridash_openai_api_key in an encrypted, ignored vault file.
