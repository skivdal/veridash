[project]
name = "veridash-worker"
version = "0.1.0"
description = "VeriDash analysis worker supervisor"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "opencv-python-headless==4.12.0.88",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "veridash-analysis",
    "veridash-core",
    "veridash-storage",
]

[project.scripts]
veridash-worker = "veridash_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridash_worker"]
artifacts = ["src/veridash_worker/py.typed"]

[tool.uv.sources]
veridash-analysis = { workspace = true }
veridash-core = { workspace = true }
veridash-storage = { workspace = true }
