[project]
name = "veridash-worker"
version = "0.1.0"
description = "VeriDash analysis worker supervisor"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "huggingface-hub>=1.7.1",
    "opencv-python-headless==4.12.0.88",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "veridash-analysis",
    "veridash-core",
    "veridash-storage",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper==1.2.1",
]
gpu = [
    "faster-whisper==1.2.1",
    "nvidia-cublas-cu12>=12.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9.10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
translation = [
    "openai==2.53.0",
]

[project.scripts]
veridash-worker = "veridash_worker.main:main"
veridash-download-transcription-model = "veridash_worker.models:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridash_worker"]
artifacts = ["src/veridash_worker/py.typed"]

[tool.uv.sources]
veridash-analysis = { workspace = true }
veridash-core = { workspace = true }
veridash-storage = { workspace = true }
