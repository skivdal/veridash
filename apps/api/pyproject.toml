[project]
name = "veridash-api"
version = "0.1.0"
description = "VeriDash FastAPI application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.122.0",
    "pydantic-settings>=2.12.0",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38.0",
    "veridash-core",
    "veridash-storage",
]

[project.scripts]
veridash-api = "veridash_api.main:run"
veridash-admin = "veridash_api.admin:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridash_api"]
artifacts = ["src/veridash_api/py.typed"]

[tool.uv.sources]
veridash-core = { workspace = true }
veridash-storage = { workspace = true }
