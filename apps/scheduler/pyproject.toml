[project]
name = "veridash-scheduler"
version = "0.1.0"
description = "VeriDash dependency scheduler and reconciler"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "veridash-analysis",
    "veridash-core",
]

[project.scripts]
veridash-scheduler = "veridash_scheduler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridash_scheduler"]
artifacts = ["src/veridash_scheduler/py.typed"]

[tool.uv.sources]
veridash-analysis = { workspace = true }
veridash-core = { workspace = true }
