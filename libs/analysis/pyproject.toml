[project]
name = "veridash-analysis"
version = "0.1.0"
description = "VeriDash analysis module contracts and lightweight registry"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12.0",
    "veridash-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridash_analysis"]
artifacts = ["src/veridash_analysis/py.typed"]

[tool.uv.sources]
veridash-core = { workspace = true }
