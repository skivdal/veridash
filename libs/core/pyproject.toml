[project]
name = "veridash-core"
version = "0.1.0"
description = "Shared side-effect-free VeriDash domain types"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veridash_core"]
artifacts = ["src/veridash_core/py.typed"]
